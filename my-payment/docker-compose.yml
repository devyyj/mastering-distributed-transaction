services:
  mariadb:
    image: mariadb:latest
    container_name: payment-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: payment_db
      MARIADB_USER: dev
      MARIADB_PASSWORD: dev
    ports:
      - "3309:3306"
    volumes:
      - payment-db-data:/var/lib/mysql

volumes:
  payment-db-data:
