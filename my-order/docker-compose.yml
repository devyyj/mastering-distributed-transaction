services:
  mariadb:
    image: mariadb:latest
    container_name: order-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: order_db
      MARIADB_USER: dev
      MARIADB_PASSWORD: dev
    ports:
      - "3307:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --binlog-row-image=FULL

volumes:
  order-db-data:
