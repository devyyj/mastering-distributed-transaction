services:
  mariadb:
    image: mariadb:latest
    container_name: point-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: point_db
      MARIADB_USER: dev
      MARIADB_PASSWORD: dev
    ports:
      - "3308:3306"
    volumes:
      - point-db-data:/var/lib/mysql

volumes:
  point-db-data:
